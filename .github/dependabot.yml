version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "msw", "@playwright/test"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
